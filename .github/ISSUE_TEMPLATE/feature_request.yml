name: Feature request
description: Suggest a driver, shell command or other improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like ROS to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What would it teach or make possible? Links to specifications are welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself
