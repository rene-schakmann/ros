name: Release

# Push a tag like `v0.3.0` to build the disk image and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install image tools and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtools dosfstools fdisk qemu-system-arm qemu-efi-aarch64
      - uses: ./.github/actions/rust
      - name: Build and test
        run: |
          make -f build.mk
          make -f build.mk smoke
        env:
          TIMEOUT: "300"
      - name: Package
        run: |
          mkdir dist
          cp target/aarch64-unknown-uefi/release/ros.efi dist/BOOTAA64.EFI
          gzip -c build/ros.img > dist/ros-${GITHUB_REF_NAME}.img.gz
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
